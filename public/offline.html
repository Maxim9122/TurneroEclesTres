<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F4EE">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Sin conexión - EclesTres</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            background: #EDE7DD;
            color: #2E2B26;
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
        }
        .tarjeta {
            background: #F7F4EE;
            border: 1px solid #DDD5C7;
            border-radius: 12px;
            padding: 32px 24px;
            max-width: 360px;
            width: 100%;
        }
        img { width: 64px; height: 64px; margin-bottom: 16px; }
        h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 22px; margin: 0 0 8px; }
        p { font-size: 14px; color: rgba(46, 43, 38, 0.7); margin: 0 0 24px; line-height: 1.5; }
        button {
            background: #6B7360;
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { background: #545A48; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <img src="/favicon.svg" alt="EclesTres">
        <h1>Sin conexión</h1>
        <p>No pudimos conectarnos a internet. Revisá tu conexión y volvé a intentarlo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
